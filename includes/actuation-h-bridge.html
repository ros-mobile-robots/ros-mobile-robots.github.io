.lv-fig .hatch{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:.9}

<figcaption>An H-bridge in its four modes. The orange band is the path of the current, and the arrow shows its direction through the motor M. Forward and reverse connect the motor to the supply +V in opposite directions. In coast, all switches are open and the motor turns on freely. In brake, the two low switches connect both motor terminals to ground, and a turning motor drives a current through this loop that slows it down.</figcaption>

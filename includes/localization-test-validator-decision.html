<figcaption>The decision of <code>drop_reason_or_record()</code> about one sample, from top to bottom. A check lets the sample go down only if its condition holds. Otherwise the arrow "no" leads to the drop reason, and the decision ends with this reason. The clock step drops no sample: the decision always goes on after it.</figcaption>

<style>
.md-typeset figure.pf-figure{margin:1em auto;width:100%;max-width:480px}
.pf-fig{width:100%;height:auto;--pf-bank:#1e63c4;--pf-battery:#b45309;font-family:var(--md-text-font-family,Roboto),sans-serif}
[data-md-color-scheme=slate] .pf-fig{--pf-bank:#82b1ff;--pf-battery:#ffab70}
.pf-fig text{fill:var(--md-default-fg-color);font-size:10px}
.pf-fig .part{fill:var(--md-default-bg-color);stroke:var(--md-default-fg-color--light);stroke-width:1}
.pf-fig .source{fill:var(--md-code-bg-color);stroke-width:2}
.pf-fig .source.bank{stroke:var(--pf-bank)}
.pf-fig .source.battery{stroke:var(--pf-battery)}
.pf-fig .line{fill:none}
.pf-fig .line.bank{stroke:var(--pf-bank);stroke-width:3}
.pf-fig .line.battery{stroke:var(--pf-battery);stroke-width:3}
.pf-fig .line.data{stroke:var(--md-default-fg-color--light);stroke-width:1.3;stroke-dasharray:4 3}
.pf-fig .line.ground{stroke:var(--md-default-fg-color--light);stroke-width:1.3}
.pf-fig .head-bank{fill:var(--pf-bank)}
.pf-fig .head-battery{fill:var(--pf-battery)}
.pf-fig .name{font-size:11px}
.pf-fig .note{font-size:9.5px;fill:var(--md-default-fg-color--light)}
.pf-fig .volt-bank{fill:var(--pf-bank);font-weight:700}
.pf-fig .volt-battery{fill:var(--pf-battery);font-weight:700}
</style>
<figure class="pf-figure">
<svg class="pf-fig" viewBox="0 0 360 292" role="img" aria-labelledby="pf-diffbot-title"><title id="pf-diffbot-title">DiffBot's power flow: the power bank supplies the Raspberry Pi, and the four AA batteries supply the motors</title><defs><marker id="pf-diffbot-bank-head" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path class="head-bank" d="M0,0 L10,5 L0,10 z"/></marker><marker id="pf-diffbot-battery-head" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path class="head-battery" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="source bank" x="10" y="6" width="140" height="38" rx="5"/>
<text class="name" x="80.0" y="29.0" text-anchor="middle">USB power bank</text>
<path class="line bank" d="M60,44 V65" marker-end="url(#pf-diffbot-bank-head)"/>
<text class="volt-bank" x="69" y="61" text-anchor="start">5 V, USB-C</text>
<rect class="part" x="10" y="70" width="140" height="60" rx="5"/>
<text class="name" x="80.0" y="104.0" text-anchor="middle">Raspberry Pi 4 B</text>
<rect class="source battery" x="220" y="6" width="130" height="38" rx="5"/>
<text class="name" x="285.0" y="22.5" text-anchor="middle">Four AA batteries</text>
<text class="note" x="285.0" y="35.5" text-anchor="middle">alkaline</text>
<path class="line battery" d="M338,44 V91" marker-end="url(#pf-diffbot-battery-head)"/>
<text class="volt-battery" x="330" y="76" text-anchor="end">6.0 V nominal</text>
<rect class="part" x="220" y="96" width="130" height="54" rx="5"/>
<text class="name" x="285.0" y="114.0" text-anchor="middle">Motor driver</text>
<text class="note" x="285.0" y="127.0" text-anchor="middle">Grove I2C Motor Driver</text>
<text class="note" x="285.0" y="140.0" text-anchor="middle">makes 5 V for its logic</text>
<path class="line battery" d="M285,150 V195" marker-end="url(#pf-diffbot-battery-head)"/>
<text class="volt-battery" x="277" y="173" text-anchor="end">switched on and off</text>
<text class="volt-battery" x="277" y="185" text-anchor="end">by the driver (PWM)</text>
<rect class="part" x="220" y="200" width="130" height="38" rx="5"/>
<text class="name" x="285.0" y="223.0" text-anchor="middle">Two DG01D-E motors</text>
<path class="line bank" d="M10,260.5 H36"/>
<text x="44" y="264" text-anchor="start">supply from the power bank</text>
<path class="line battery" d="M10,274.5 H36"/>
<text x="44" y="278" text-anchor="start">supply from the motor battery</text>
</svg>
<figcaption>DiffBot's two supplies. Follow each color from its source at the top.</figcaption>
</figure>

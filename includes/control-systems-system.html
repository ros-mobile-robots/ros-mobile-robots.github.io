<figure class="cs-figure" id="system-figure">
<svg class="cs-fig" viewBox="0 0 360 318" role="img" aria-labelledby="cs-system-title"><title id="cs-system-title">A system: actuators give inputs to the process, and sensors turn its outputs into observations</title><defs><marker id="cs-system-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="block" x="95.0" y="6" width="170" height="44" rx="5"/>
<text class="name" x="180.0" y="24.5" text-anchor="middle">Actuators</text>
<text class="example" x="180.0" y="39.5" text-anchor="middle">motor driver and motor</text>
<path class="arrow" d="M180.0,50 V103" marker-end="url(#cs-system-head)"/>
<text x="188.0" y="72" text-anchor="start">inputs</text>
<text class="example" x="188.0" y="86" text-anchor="start">torque on the wheel</text>
<rect class="block" x="95.0" y="104" width="170" height="44" rx="5"/>
<text class="name" x="180.0" y="122.5" text-anchor="middle">Process and environment</text>
<text class="example" x="180.0" y="137.5" text-anchor="middle">wheel, robot and ground</text>
<path class="arrow" d="M180.0,148 V201" marker-end="url(#cs-system-head)"/>
<text x="188.0" y="170" text-anchor="start">outputs</text>
<text class="example" x="188.0" y="184" text-anchor="start">wheel speed</text>
<rect class="block" x="95.0" y="202" width="170" height="44" rx="5"/>
<text class="name" x="180.0" y="220.5" text-anchor="middle">Sensors</text>
<text class="example" x="180.0" y="235.5" text-anchor="middle">wheel encoder</text>
<path class="arrow" d="M180.0,246 V292" marker-end="url(#cs-system-head)"/>
<text x="188.0" y="266" text-anchor="start">observations</text>
<text class="example" x="188.0" y="280" text-anchor="start">measured wheel speed</text>
<text class="legend" x="180.0" y="312" text-anchor="middle">Blue: an example, the speed of one of the robot's wheels</text>
</svg>
<figcaption>A system from its actuators to its sensors. Read the figure from top to bottom. In the example, the measured wheel speed comes about like this: the wheel turns, the encoder's two Hall sensors give pulses, the Teensy counts their edges, and the firmware computes the angular velocity from the change of the count and the time it took.</figcaption>
</figure>

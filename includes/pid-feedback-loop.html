<figcaption>One wheel's speed control loop. Start at the target wheel speed (1) from the single-board computer (SBC) and follow the numbers around the loop, back to the comparison in the circle. The boxes inside the microcontroller firmware are code. The motor driver, the motor with the wheel and the encoder are hardware. The blue values are one control step of Remo's left wheel. The firmware doesn't log the ticks (6). They are calculated from the measured speed (7). The time line shows that a control step measures the speed over the previous interval and sets the motor command for the next one. The example takes each interval as the nominal 50 ms. The encoder senses the motor shaft before the gearbox, and the firmware uses 542 ticks per wheel turn.</figcaption>
</figure>

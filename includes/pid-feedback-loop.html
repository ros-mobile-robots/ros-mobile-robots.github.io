<style>
.md-typeset figure.pid-loop-figure{margin:1em auto;width:100%;max-width:480px}
.pid-loop{width:100%;height:auto;--pid-value:#1e63c4;font-family:var(--md-text-font-family,Roboto),sans-serif}
[data-md-color-scheme=slate] .pid-loop{--pid-value:#82b1ff}
.pid-loop text{fill:var(--md-default-fg-color);font-size:12px}

.pid-loop .number{fill:var(--md-default-bg-color);font-size:11px;font-weight:700}
.pid-loop .name{font-size:13px}

.pid-loop .sign{font-size:15px;font-weight:700}

.pid-loop .time-line{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:1.3}
.pid-loop .time-step{fill:none;stroke:var(--md-default-fg-color);stroke-width:2.5}
</style>
<figure class="pid-loop-figure">
<svg class="pid-loop" viewBox="0 0 360 538" role="img" aria-labelledby="pid-loop-title"><title id="pid-loop-title">One wheel's speed control loop in the Teensy firmware, with the motor driver, the motor, the wheel and the encoder, and a time line of one control step</title><defs><marker id="pid-loop-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>

<text class="name" x="90.0" y="26.0" text-anchor="middle">Raspberry Pi</text>

<circle class="number-disc" cx="104" cy="52" r="8"/>

<text x="116" y="56" text-anchor="start">target wheel speed</text>

<text class="sign" x="107" y="156" text-anchor="start">−</text>

<text class="number" x="118" y="115.8" text-anchor="middle">7</text>

<circle class="number-disc" cx="104" cy="168" r="8"/>
<text class="number" x="104" y="171.8" text-anchor="middle">2</text>
<text x="116" y="172" text-anchor="start">error <tspan class="symbol">e</tspan></text>
<text class="value" x="116" y="186" text-anchor="start">0.50 rad/s</text>
<rect class="code" x="15" y="198" width="150" height="56" rx="5"/>
<text class="name" x="90.0" y="216.0" text-anchor="middle">PID controller</text>
<text class="note" x="90.0" y="230.0" text-anchor="middle">K_P 0.6, K_I 0.3, K_D 0.5</text>
<text class="note" x="90.0" y="244.0" text-anchor="middle">output limited to ±255</text>
<rect class="code" x="205" y="198" width="130" height="56" rx="5"/>

<path class="arrow" d="M90,254 V321" marker-end="url(#pid-loop-head)"/>

</svg>
<figcaption>One wheel's speed control loop. Start at the target wheel speed (1) and follow the numbers around the loop, back to the comparison in the circle. The boxes inside the Teensy firmware are code. The motor driver, the motor with the wheel and the encoder are hardware. The blue values are one control step of Remo's left wheel. The firmware doesn't log the ticks (6). They are calculated from the measured speed (7). The time line shows that a control step measures the speed over the previous 50 ms and sets the motor command for the next 50 ms.</figcaption>
</figure>

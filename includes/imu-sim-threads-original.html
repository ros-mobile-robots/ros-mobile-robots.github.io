<svg class="th-fig" viewBox="0 0 360 352" role="img" aria-labelledby="th-original-title th-original-description"><title id="th-original-title">The request with the original IMU plugin</title><desc id="th-original-description">Step 1: the controller spawner, another ROS node, sends a switch_controller request, which waits in the callback queue. Step 2: the physics thread calls the IMU plugin’s UpdateChild(), which publishes the IMU message and calls ros::spinOnce(). Step 3: ros::spinOnce() takes the request from the queue and runs the callback in the physics thread. Step 4: the callback notes the change and waits for update(). Step 5: update() never runs, because its thread is waiting. This is a deadlock: the clock stops. The ROS spinner thread finds the queue empty.</desc><defs><marker id="th-original-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="flow-head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="th-original-request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="request-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>

<text class="note" transform="translate(13,66) rotate(-90)" text-anchor="end">time</text>

<text class="mono" x="98.0" y="183" text-anchor="middle">switch_controller</text>

<text x="98.0" y="211" text-anchor="middle">notes the change,</text>

<figcaption markdown="span">With gazebo_plugins’ original IMU plugin. Time runs downward, and the numbers are the steps in the text. Blue is the `switch_controller` request and its callback. The callback runs in the physics thread and waits for an `update()` that only this thread can run.</figcaption>

<figcaption>One drive of the simulation test from above. Solid orange: where the robot really is, in this figure's model. Dashed blue: where the odometry says the robot is, drawn with the wheel radius and separation that the controller is configured with. Gray cross: where the command alone would put the robot. Faint: the start. Both frames are <code>base_footprint</code>.<span class="ix-static-note"> The picture shows the first example, with Remo's values.</span></figcaption>
<div class="ix-steps">
<p><b>Five drives to try.</b> Each one changes a single value of Remo. Guess the answer first.</p>
<div class="ix-stepper" data-live hidden><button type="button" class="ix-previous">Previous</button><span class="ix-step-count" aria-live="polite"></span><button type="button" class="ix-next">Next</button></div>
<ol class="ix-examples"><li data-example-item="radius" data-expected="{&quot;odometry&quot;: [0.6000000000000001, 0.0, 0.0], &quot;model&quot;: [0.5454545454545454, 0.0, 0.0], &quot;failing&quot;: [&quot;odometry and true pose, forward&quot;], &quot;checks&quot;: 7}"><span class="ix-question"><b>The configured wheel radius is 10 % too big.</b> The robot is told to drive 0.6 m. How far does the odometry say the robot drove, and how far did the robot drive?</span> <button type="button" class="ix-show" data-example="radius" data-live hidden>Show what happens</button><span class="ix-answer">The odometry reports 0.600 m. The robot drives 0.545 m. The controller commands fewer wheel turns, and multiplies them by the same too-big radius. Only the check that compares the odometry with the true pose fails.</span></li><li data-example-item="separation" data-expected="{&quot;odometry&quot;: [0.0, 0.0, 1.5], &quot;model&quot;: [0.0, 0.0, 1.425], &quot;failing&quot;: [], &quot;checks&quot;: 5}"><span class="ix-question"><b>The configured wheel separation is 5 % too small.</b> The robot is told to turn 1.5 rad on the spot. Does a check fail?</span> <button type="button" class="ix-show" data-example="separation" data-live hidden>Show what happens</button><span class="ix-answer">No. The odometry reports 1.500 rad, and the robot turns 1.425 rad. The two differ by 0.075 rad, and the check allows 0.1 rad. The test only catches a separation that is off by more than about 7 %.</span></li><li data-example-item="offset" data-expected="{&quot;odometry&quot;: [0.0, 0.0, 1.5], &quot;model&quot;: [0.018585255966645942, -0.01994989973208109, 1.5], &quot;failing&quot;: [&quot;distance from the start, true pose&quot;], &quot;checks&quot;: 5}"><span class="ix-question"><b>What if <code>base_footprint</code> were 2 cm behind the axle?</b> The robot turns 1.5 rad on the spot. Does <code>base_footprint</code> stay where it was?</span> <button type="button" class="ix-show" data-example="offset" data-live hidden>Show what happens</button><span class="ix-answer">No. The robot turns about the midpoint of its axle. A frame 2 cm behind that midpoint moves 2.7 cm on an arc, and the check that allows 0.02 m fails. The odometry reports no movement. On DiffBot and Remo, <code>base_footprint</code> is at the axle's midpoint and stays in place.</span></li><li data-example-item="contact" data-expected="{&quot;odometry&quot;: [0.0, 0.0, 1.5], &quot;model&quot;: [0.0, 0.0, 1.2781065088757397], &quot;failing&quot;: [&quot;odometry and true pose, turned&quot;], &quot;checks&quot;: 5}"><span class="ix-question"><b>What if the wheels pushed on the ground at their outer edges?</b> The robot is told to turn 1.5 rad on the spot. How far does the robot turn?</span> <button type="button" class="ix-show" data-example="contact" data-live hidden>Show what happens</button><span class="ix-answer">The robot turns 1.278 rad, 15 % less, because its wheels push 0.169 m apart instead of 0.144 m. The odometry still reports 1.500 rad, so the check that compares the two fails. In the simulation, the wheels' collision shapes are spheres, which touch the ground in the middle of the wheel.</span></li><li data-example-item="tracking" data-expected="{&quot;odometry&quot;: [0.4800000000000001, 0.0, 0.0], &quot;model&quot;: [0.4800000000000001, 0.0, 0.0], &quot;failing&quot;: [&quot;forward, odometry&quot;, &quot;forward, true pose&quot;], &quot;checks&quot;: 7}"><span class="ix-question"><b>The wheels reach only 80 % of their commanded speed.</b> The robot is told to drive 0.6 m. Do the odometry and the true pose still agree?</span> <button type="button" class="ix-show" data-example="tracking" data-live hidden>Show what happens</button><span class="ix-answer">Yes. Both show 0.480 m, because the odometry counts the wheel turns that really happened. The two checks against the expected 0.6 m fail, and the check that compares the odometry with the true pose passes.</span></li></ol>
</div>

<p class="ix-model-note"><b>What this figure computes.</b> Kinematics only: the wheels roll without slipping and reach their speed at once, and the robot moves exactly as its wheel speeds and its geometry dictate. Gazebo's true pose also depends on the motor control, the contacts and the timing of the commands, so the simulation test measures slightly different values. The browser doesn't run the test: the checks are predicted with the test's tolerances. Geometry and tolerances: <a href="https://github.com/ros-mobile-robots/diffbot/blob/f5f282eed7b6a2b146d40c7d5fd641b8a339a77d/diffbot_control/config"><code>geometry.yaml</code></a> and <a href="https://github.com/ros-mobile-robots/diffbot/blob/f5f282eed7b6a2b146d40c7d5fd641b8a339a77d/diffbot_gazebo/test/test_drive.py"><code>test_drive.py</code></a> at diffbot <code>f5f282e</code>.</p>

<figcaption><p>One drive of the simulation test from above. Solid orange: where the robot really is, in this figure's model. Dashed blue: where the odometry says the robot is, drawn with the wheel radius and separation that the controller is configured with. Gray cross: where the command alone would put the robot. Faint: the start. Both frames are <code>base_footprint</code>.</p><p class="ix-model-note"><b>What this figure computes.</b> Kinematics only: the wheels roll without slipping and reach their speed at once, and the robot moves exactly as its wheel speeds and its geometry dictate. Gazebo's true pose also depends on the motor control, the contacts and the timing of the commands, so the simulation test measures slightly different values. The browser doesn't run the test: the checks are predicted with the test's tolerances. Geometry and tolerances: <a href="https://github.com/ros-mobile-robots/diffbot/blob/f5f282eed7b6a2b146d40c7d5fd641b8a339a77d/diffbot_control/config"><code>geometry.yaml</code></a> and <a href="https://github.com/ros-mobile-robots/diffbot/blob/f5f282eed7b6a2b146d40c7d5fd641b8a339a77d/diffbot_gazebo/test/test_drive.py"><code>test_drive.py</code></a> at diffbot <code>f5f282e</code>.</p></figcaption>

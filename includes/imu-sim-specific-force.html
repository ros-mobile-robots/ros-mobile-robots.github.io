<style>
.md-typeset figure.imu-figure{margin:1em auto;width:100%;max-width:none}
.imu-figure .imu-panels{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:.8rem 1.6rem}
.imu-figure .imu-fig{flex:1 1 var(--imu-basis,300px);max-width:var(--imu-max,400px)}
.md-typeset .imu-figure figcaption{max-width:36rem}
.imu-fig{width:100%;height:auto;--imu-x:#d32f2f;--imu-y:#2e7d32;--imu-z:#1565c0;--imu-board:#9db9e6;--imu-gravity:#546e7a;--imu-acceleration:#e65100;--imu-reading:#7b1fa2;font-family:var(--md-text-font-family,Roboto),sans-serif}
[data-md-color-scheme=slate] .imu-fig{--imu-x:#ff7b72;--imu-y:#6fcf73;--imu-z:#6cb2ff;--imu-board:#3d5a8c;--imu-gravity:#a7b6be;--imu-acceleration:#ffa94d;--imu-reading:#d79bea}
.imu-fig text{fill:var(--md-default-fg-color);font-size:12px}
.imu-fig .title{font-size:13px;font-weight:700}
.imu-fig .mono{font-family:var(--md-code-font-family,"Roboto Mono"),monospace;font-size:11.5px}
.imu-fig .note{font-size:11px;fill:var(--md-default-fg-color--light)}
.imu-fig .strong{font-weight:700}
.imu-fig .sub{font-size:9px}
.imu-fig .halo{paint-order:stroke;stroke:var(--md-default-bg-color);stroke-width:3.5px;stroke-linejoin:round}
.imu-fig .body{fill:var(--md-default-fg-color--lightest);stroke:var(--md-default-fg-color--lighter);stroke-width:1}
.imu-fig .wheel{fill:var(--md-default-fg-color--lighter);stroke:var(--md-default-fg-color--light);stroke-width:1}
.imu-fig .part{fill:var(--md-default-bg-color);stroke:var(--md-default-fg-color--lighter);stroke-width:1}
.imu-fig .board{fill:var(--imu-board);stroke:var(--md-default-fg-color--light);stroke-width:1}
.imu-fig .floor{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:1.5}
.imu-fig .joint{fill:none;stroke:var(--md-default-fg-color);stroke-width:1.6;stroke-dasharray:5 3}
.imu-fig .guide{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:1;stroke-dasharray:2 3}
.imu-fig .dot{fill:var(--md-default-fg-color)}
.imu-fig .x{stroke:var(--imu-x);fill:var(--imu-x)}
.imu-fig .y{stroke:var(--imu-y);fill:var(--imu-y)}
.imu-fig .z{stroke:var(--imu-z);fill:var(--imu-z)}
.imu-fig .gravity{stroke:var(--imu-gravity);fill:var(--imu-gravity)}
.imu-fig .acceleration{stroke:var(--imu-acceleration);fill:var(--imu-acceleration)}
.imu-fig .reading{stroke:var(--imu-reading);fill:var(--imu-reading)}
.imu-fig .motion{stroke:var(--md-default-fg-color--light);fill:var(--md-default-fg-color--light)}
.imu-fig .context{opacity:.62}
.imu-fig .shaft{fill:none;stroke-width:2.4;stroke-linecap:round}
.imu-fig .turn{stroke-width:2}
.imu-fig .thin{stroke-width:1.5}
.imu-fig .dashed{stroke-dasharray:4 3}
.imu-fig .head{stroke:none}
.imu-fig .ring{fill:var(--md-default-bg-color);stroke-width:1.8}
.imu-fig text.x,.imu-fig text.y,.imu-fig text.z,.imu-fig text.gravity,.imu-fig text.acceleration,.imu-fig text.reading{stroke:none;font-weight:700}
.imu-fig text.halo{stroke:var(--md-default-bg-color)}
</style>

<figcaption><code>linear_acceleration</code> is the specific force <strong>f</strong> = <strong>a</strong> − <strong>g</strong>: the acceleration <strong>a</strong> of the sensor minus gravity <strong>g</strong>, in m/s². The arrows show directions. Their lengths aren’t to scale. In the turn, the dotted circle is the sensor’s path, and <strong>f</strong> points up, at you.</figcaption>
</figure>

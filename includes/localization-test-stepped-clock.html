<p class="lv-band">What each step sends</p>
<ul class="lv-legend lv-keys">
<li><svg class="lv-key" viewBox="0 0 24 12" aria-hidden="true"><path class="wheels-line" d="M1,6 H23"/></svg>wheel odometry: 0.4 rad/s in every step of every phase</li>
<li><svg class="lv-key" viewBox="0 0 24 12" aria-hidden="true"><path class="imu-line" d="M1,6 H23"/></svg>IMU: the valid samples report 0.5 rad/s</li>
<li><span class="lv-sign">✓</span>a valid IMU sample in each step of the phase. The validator forwards it</li>
<li><span class="lv-sign">✕</span>an IMU sample that the validator has to drop, in each step of the phase. It reports 2.0 rad/s, which is beyond the chart. Its stamp is 0.5 s before the time of the step in phase 2, the stamp of the valid sample in phase 3, 0.5 s after the time of the step in phase 4, and 0.01 s before the time of the step in phase 5. In phases 3 to 5, the test sends it after the valid sample</li>
</ul>
<p class="lv-band">What the test asserts</p>
<ul class="lv-legend lv-keys">
<li><svg class="lv-key" viewBox="0 0 24 12" aria-hidden="true"><path class="estimate-range" d="M12,1 V11 M8.5,1 h7 M8.5,11 h7"/></svg>the range for the last output of a phase: 0.5 ± 0.01 rad/s, and 0.4 ± 0.02 rad/s in phase 2</li>
<li><svg class="lv-key" viewBox="0 0 24 12" aria-hidden="true"><path class="limit" d="M1,6 H23"/></svg>the limit in phases 2 to 5: no output that the test keeps, one per step, may be above 0.51 rad/s</li>
</ul>
<p class="lv-band">What the test printed in a run at the diffbot commit 3ef4a91</p>
<ul class="lv-legend lv-keys">
<li><svg class="lv-key" viewBox="0 0 24 12" aria-hidden="true"><circle class="estimate-dot" cx="12" cy="6" r="4"/></svg>the filter's estimate in the last output of phase 1, 0.4987 rad/s, of phase 2, 0.4005 rad/s, and of phase 6, 0.4987 rad/s</li>
<li><svg class="lv-key" viewBox="0 0 24 12" aria-hidden="true"><path class="estimate-path" d="M1,6 H23"/></svg>joins the first estimate of phase 2, 0.4966 rad/s, and the last one. The run printed only these two</li>
</ul>
<figcaption>The stepped-clock test from left to right, one step every 20 ms of ROS time. The rows "IMU valid" and "IMU to drop" show the samples of one step of each phase. At the solid vertical line, the clock goes back from 107 s to 50 s.</figcaption>

<figcaption>The view looks along the shaft from the commutator's end. a and b are the two sides of one winding. Each connects to one of the commutator's two segments, and b's segment and link are dashed. Trace the highlighted current from the + brush through the segment that it touches to the side next to the N magnet. There the current runs into the page (×), and it comes back out of the page in the side next to S (•). The magnets' field, from N to S, pushes the first side down and the second up, so the rotor turns counterclockwise. Half a turn later, a and b have swapped places, and the + brush touches b's segment. The side next to N again carries the current into the page, so the push keeps turning the rotor the same way. Real motors have several windings and segments.</figcaption>

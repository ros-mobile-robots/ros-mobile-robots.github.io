<li><span class="lv-sign"></span><strong>fused:</strong> in the trace, the filter fused the wheel message and published the result, stamped with the message's time</li>
<li><span class="lv-sign"></span><strong>predicted:</strong> in the trace, the filter predicted to the time of the wheel message, without a measurement, because the ROS time was 0.1 s or more, its sensor_timeout, past its last measurement. It published the prediction, stamped with that time. It fuses the wheel message in the next update, but publishes no second output with the same stamp. The next output contains the message</li>
</ul>

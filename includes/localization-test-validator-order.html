<style>
.md-typeset figure.lv-figure{margin:1em auto;width:100%;max-width:480px}
.lv-figure,.lv-fig{--lv-good:#0ca30c;--lv-bad:#d03b3b;--lv-good-fill:rgba(12,163,12,.13);--lv-bad-fill:rgba(208,59,59,.10);--lv-wheels:#2a78d6;--lv-imu:#eb6834;--lv-estimate:#1baf7a}
[data-md-color-scheme=slate] .lv-figure,[data-md-color-scheme=slate] .lv-fig{--lv-good-fill:rgba(12,163,12,.22);--lv-bad-fill:rgba(208,59,59,.20);--lv-wheels:#3987e5;--lv-imu:#d95926;--lv-estimate:#199e70}
.lv-fig{width:100%;height:auto;font-family:var(--md-text-font-family,Roboto),sans-serif}
.lv-fig text{fill:var(--md-default-fg-color);font-size:10px}
.lv-fig .band{font-weight:700}
.lv-fig .name{font-size:11px}
.lv-fig .mono{font-family:var(--md-code-font-family,"Roboto Mono"),monospace;font-size:9.5px}
.lv-fig .note{font-size:9.5px;fill:var(--md-default-fg-color--light)}
.lv-fig .strong{font-weight:700}
.lv-fig .item{fill:var(--md-default-bg-color);stroke:var(--md-default-fg-color--light);stroke-width:1}
.lv-fig .axis{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:1.3}
.lv-fig .tick{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:1}
.lv-fig .now{fill:none;stroke:var(--md-default-fg-color);stroke-width:1.6}
.lv-fig .dimension{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:1}
.lv-fig .pass-zone{fill:var(--lv-good-fill);stroke:var(--lv-good);stroke-width:1}
.lv-fig .drop-zone{fill:var(--lv-bad-fill);stroke:none}
.lv-fig .pass-mark{fill:var(--md-default-bg-color);stroke:var(--lv-good);stroke-width:1.8}
.lv-fig .drop-mark{fill:var(--md-default-bg-color);stroke:var(--lv-bad);stroke-width:1.8;stroke-dasharray:2.6 1.8}
.lv-fig .letter{font-size:9px;font-weight:700}
.lv-fig .cell{fill:var(--md-default-bg-color);stroke:var(--md-default-fg-color--light);stroke-width:.8}
.lv-fig .cell-fused{fill:var(--lv-good-fill);stroke:var(--lv-good);stroke-width:1.6}
.lv-fig .cell-zero{fill:url(#lv-hatch);stroke:var(--md-default-fg-color--light);stroke-width:.8;stroke-dasharray:2 2}
.lv-fig .hatch{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:.9}
.lv-fig .subscript{font-size:7.5px}
.md-typeset figure.lv-figure.lv-large{max-width:400px}
.md-typeset figure.lv-figure.lv-grids{max-width:520px}
.lv-large .lv-fig text,.lv-grids .lv-fig text{font-size:12px}
.lv-large .lv-fig .name,.lv-grids .lv-fig .name{font-size:12.5px}
.lv-large .lv-fig .mono,.lv-grids .lv-fig .mono{font-size:11px}
.lv-large .lv-fig .note,.lv-grids .lv-fig .note{font-size:11px}
.lv-large .lv-fig .letter{font-size:10.5px}
.lv-grids .lv-fig .subscript{font-size:9px}
.lv-grids .lv-pair{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em 1em}
.lv-grids .lv-pair .lv-fig{width:236px;max-width:100%}
.md-typeset .lv-band{margin:.9em 0 .2em;font-weight:700;font-size:.7rem;text-align:left}
.md-typeset ul.lv-legend{list-style:none;margin:.3em 0 .6em;padding:0;text-align:left;font-size:.7rem}
.md-typeset ul.lv-legend li{margin:0 0 .25em;padding-left:2em;text-indent:-2em}
.lv-legend .lv-mark{display:inline-block;box-sizing:border-box;width:1.6em;height:1.6em;line-height:1.35em;border-radius:50%;border:2px solid var(--lv-good);text-align:center;text-indent:0;font-weight:700;font-size:.9em;margin-right:.4em}
.lv-legend .lv-mark.lv-drop{border:2px dashed var(--lv-bad)}
.lv-legend .lv-swatch{display:inline-block;box-sizing:border-box;width:1.6em;height:1.2em;line-height:1em;vertical-align:-.2em;border:1px solid var(--md-default-fg-color--light);text-align:center;text-indent:0;font-weight:700;margin-right:.4em}
.lv-legend .lv-swatch.lv-fused{background:var(--lv-good-fill);border:2px solid var(--lv-good)}
.lv-legend .lv-swatch.lv-zero{border-style:dashed;background:repeating-linear-gradient(45deg,transparent 0 3px,var(--md-default-fg-color--lighter) 3px 4px)}
.lv-fig .cut{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:1.3}
.lv-fig .cut-gap{fill:var(--md-default-bg-color);stroke:none}
.lv-fig .former-stamp,.lv-key .former-stamp{fill:none;stroke:var(--md-default-fg-color);stroke-width:1.6;stroke-dasharray:3.5 2.5}
.lv-fig .wheels-line,.lv-key .wheels-line{fill:none;stroke:var(--lv-wheels);stroke-width:2.4}
.lv-fig .imu-line,.lv-key .imu-line{fill:none;stroke:var(--lv-imu);stroke-width:2.4}
.lv-fig .estimate-dot,.lv-key .estimate-dot{fill:var(--lv-estimate);stroke:var(--md-default-bg-color);stroke-width:2}
.lv-fig .estimate-range,.lv-key .estimate-range{fill:none;stroke:var(--lv-estimate);stroke-width:2}
.lv-fig .estimate-path,.lv-key .estimate-path{fill:none;stroke:var(--lv-estimate);stroke-width:1.6;stroke-dasharray:2 2.5}
.lv-fig .limit,.lv-key .limit{fill:none;stroke:var(--md-default-fg-color);stroke-width:1.2;stroke-dasharray:5 3}
.lv-fig .phase-edge{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:.8;stroke-dasharray:1.5 2.5}
.lv-fig .clock-jump{fill:none;stroke:var(--md-default-fg-color);stroke-width:1.6}
.lv-large .lv-fig .letter{font-size:11px}
.lv-large .lv-fig .sign{font-size:12.5px;font-weight:700}
.lv-large .lv-fig .index{font-size:9.8px}
.lv-fig .halo{paint-order:stroke;stroke:var(--md-default-bg-color);stroke-width:4px;stroke-linejoin:round}
.lv-fig .lifeline{fill:none;stroke:var(--md-default-fg-color--light);stroke-width:1;stroke-dasharray:3 3}
.lv-fig .message{fill:none;stroke:var(--md-default-fg-color);stroke-width:1.3}
.lv-fig .message-head{fill:var(--md-default-fg-color);stroke:none}
.lv-legend .lv-key{display:inline-block;width:2em;height:1em;vertical-align:-.12em;margin-right:.4em;overflow:visible}
.lv-legend .lv-sign{display:inline-block;width:2em;margin-right:.4em;text-align:center;text-indent:0;font-weight:700}
.md-typeset ul.lv-legend.lv-keys li{padding-left:2.4em;text-indent:-2.4em}
.lv-legend .lv-key.lv-narrow{width:1.45em;margin-right:.35em}
.md-typeset ul.lv-legend.lv-row{display:flex;flex-wrap:wrap;gap:.1em 1.1em}
.md-typeset ul.lv-legend.lv-row li{margin:0;padding-left:0;text-indent:0}
</style>
<figure class="lv-figure lv-large">
<svg class="lv-fig" viewBox="0 0 300 76" role="img" aria-labelledby="lv-test-order-title"><title id="lv-test-order-title">Check 5 in the tests, after a valid sample stamped 100 s: a sample with an older stamp or the same stamp is dropped, a sample stamped 1 ns later is forwarded, and so is a later sample that follows a dropped sample stamped 5 s ahead</title>
<rect class="drop-zone" x="14.0" y="6.0" width="96.0" height="46.0" rx="0"/>
<rect class="pass-zone" x="110.0" y="6.0" width="176.0" height="46.0" rx="0"/>
<text class="strong" x="17.0" y="19.0" text-anchor="start">not later</text>
<text class="strong" x="283.0" y="19.0" text-anchor="end">later</text>
<path class="axis" d="M14,52 H293"/>
<path class="axis" d="M293,52 l-6,-3.5 M293,52 l-6,3.5"/>
<path class="tick" d="M30.0,52 v4"/>
<path class="tick" d="M70.0,52 v4"/>
<path class="tick" d="M110.0,52 v4"/>
<path class="tick" d="M150.0,52 v4"/>
<path class="tick" d="M190.0,52 v4"/>
<rect class="cut-gap" x="214.5" y="51.0" width="7.0" height="2.0" rx="0"/>
<path class="cut" d="M212.5,57 l4,-10 M219.5,57 l4,-10"/>
<path class="now" d="M110.0,2 V58"/>
<text class="name" x="110.0" y="70.0" text-anchor="middle">100 s: the last valid stamp</text>
<text class="note" x="254.0" y="70.0" text-anchor="middle">105 s</text>
<g><title>Sample E: dropped. stamped 0.01 s before 100 s. The sample arrived out of order</title><circle class="drop-mark" cx="90.0" cy="42.0" r="7.5"/><text class="letter" x="90.0" y="45.8" text-anchor="middle">E</text></g>
<g><title>Sample F: dropped. stamped 100 s again. The sample came twice</title><circle class="drop-mark" cx="110.0" cy="42.0" r="7.5"/><text class="letter" x="110.0" y="45.8" text-anchor="middle">F</text></g>
<g><title>Sample G: forwarded. stamped 1 ns after 100 s, the smallest step of a stamp</title><circle class="pass-mark" cx="128.0" cy="42.0" r="7.5"/><text class="letter" x="128.0" y="45.8" text-anchor="middle">G</text></g>
<g><title>Sample H: dropped. stamped 105 s. Check 4 drops it as too far ahead</title><circle class="drop-mark" cx="254.0" cy="42.0" r="7.5"/><text class="letter" x="254.0" y="45.8" text-anchor="middle">H</text></g>
<g><title>Sample I: forwarded. sent after H, stamped 100.02 s. The validator compares the stamp with 100 s, not with the stamp of H</title><circle class="pass-mark" cx="150.0" cy="42.0" r="7.5"/><text class="letter" x="150.0" y="45.8" text-anchor="middle">I</text></g>
<text class="note halo" x="119.0" y="30.5" text-anchor="middle">1 ns</text>
<text class="note halo" x="286.0" y="30.5" text-anchor="end">check 4: too far ahead</text>
</svg>
<ul class="lv-legend">
<li><span class="lv-mark lv-drop">E</span><strong>✕ dropped:</strong> stamped 0.01 s before 100 s. The sample arrived out of order</li>
<li><span class="lv-mark lv-drop">F</span><strong>✕ dropped:</strong> stamped 100 s again. The sample came twice</li>
<li><span class="lv-mark">G</span><strong>✓ forwarded:</strong> stamped 1 ns after 100 s, the smallest step of a stamp</li>
<li><span class="lv-mark lv-drop">H</span><strong>✕ dropped:</strong> stamped 105 s. Check 4 drops it as too far ahead</li>
<li><span class="lv-mark">I</span><strong>✓ forwarded:</strong> sent after H, stamped 100.02 s. The validator compares the stamp with 100 s, not with the stamp of H</li>
</ul>
<figcaption>Check 5 in two tests, after a valid sample stamped 100 s. G lies 1 ns after F. The figure draws them apart.</figcaption>
</figure>

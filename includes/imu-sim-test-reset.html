<figcaption markdown="span">The reset test, as an idealized example: the reset comes at exactly 3 s, and the IMU publishes exactly 50 samples per second. The robot stands still, and the test sends no command. Each panel shows the stamps of the IMU’s samples while the simulation runs. The horizontal axis doesn’t start over at the reset. The test counts a sample as fresh when the sample arrives after the test saved its count of samples, just before the reset call, with a stamp later than 0 s, later than the last fresh stamp and below `RECOVERY`, 1 s. In this ideal run, these are the samples in the gray area. The test passes with 10 fresh samples. It polls with a wall-time timeout of 30 s. The dot in the first panel is sample 10, stamped about 0.20 s. A repeated stamp doesn’t count, so a stream that repeats one stamp fails.</figcaption>

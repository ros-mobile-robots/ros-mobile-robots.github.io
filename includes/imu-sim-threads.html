<figure>
<svg class="th-fig" viewBox="0 0 340 338" role="img" aria-labelledby="th-ok-t th-ok-d"><title id="th-ok-t">Callbacks served by ROS threads</title><desc id="th-ok-d">The controller spawner, another ROS node, sends a switch_controller request. It waits in the global callback queue. A ROS spinner thread takes it and runs the service's callback, which hands the change to update() and waits. Meanwhile the physics thread keeps stepping: UpdateChild() publishes the IMU message, update() runs the controllers, and in a later step update() takes the change. The callback returns, and the spawner gets its answer.</desc><defs><marker id="th-ok-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="th-ok-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-b" d="M0,0 L10,5 L0,10 z"/></marker><marker id="th-ok-time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-t" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="t-num" x="6" y="22" text-anchor="start">1</text>

<figure>
<svg class="th-fig" viewBox="0 0 340 378" role="img" aria-labelledby="th-dl-t th-dl-d"><title id="th-dl-t">A callback taken by the original IMU plugin</title><desc id="th-dl-d">The same request waits in the global callback queue. Before a spinner thread takes it, the original IMU plugin's UpdateChild() publishes the IMU message and calls ros::spinOnce(), which runs the service's callback in the physics thread. The callback hands the change to update() and waits. update() runs only in the physics thread, which is busy waiting, so the next update() never runs. The step never ends, the simulation's clock stops, and the spawner never gets its answer. The spinner thread finds the queue empty.</desc><defs><marker id="th-dl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0,0 L10,5 L0,10 z"/></marker><marker id="th-dl-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-b" d="M0,0 L10,5 L0,10 z"/></marker><marker id="th-dl-time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h-t" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="t-num" x="6" y="22" text-anchor="start">2</text>
<text class="t-title" x="22" y="22" text-anchor="start">A callback taken</text>
<text class="t-title" x="22" y="37" text-anchor="start">by the original</text>
<text class="t-title" x="22" y="52" text-anchor="start">IMU plugin</text>
<rect class="box" x="176" y="6" width="160" height="34" rx="4"/>
<text class="t-node" x="256" y="20" text-anchor="middle">controller spawner</text>
<text class="t-sub" x="256" y="33" text-anchor="middle">another ROS node</text>
<path class="a" marker-end="url(#th-dl-a)" d="M256,40 V64"/>
<text class="t-flow" x="262" y="56" text-anchor="start">request</text>
<rect class="queue" x="176" y="66" width="160" height="34" rx="4"/>
<text class="t-node" x="256" y="80" text-anchor="middle">global callback queue</text>
<text class="t-sub" x="256" y="93" text-anchor="middle">a list, not a thread</text>
<rect class="lane" x="16" y="112" width="150" height="262" rx="6"/>
<text class="t-lane" x="23" y="127" text-anchor="start">physics thread</text>
<rect class="lane" x="176" y="112" width="160" height="262" rx="6"/>
<text class="t-lane" x="183" y="127" text-anchor="start">ROS spinner thread</text>
<path class="time" marker-end="url(#th-dl-time)" d="M7,136 V364"/>

<path class="frame" d="M22,280 V136 H160 V280"/>
<path class="frame-open" d="M22,280 V300 M160,280 V300"/>
<text class="t-mono" x="91" y="149" text-anchor="middle">UpdateChild()</text>
<text class="t-sub" x="91" y="162" text-anchor="middle">publishes the IMU message</text>
<path class="frame" d="M30,276 V170 H152 V276"/>
<path class="frame-open" d="M30,276 V292 M152,276 V292"/>
<text class="t-mono" x="91" y="183" text-anchor="middle">ros::spinOnce()</text>
<text class="t-sub" x="91" y="196" text-anchor="middle">runs the callback here</text>
<rect class="cb" x="38" y="200" width="106" height="76" rx="4"/>
<text class="t-mono" x="91" y="214" text-anchor="middle">switch_controller</text>
<text class="t-sub" x="91" y="227" text-anchor="middle">callback</text>
<text class="t-node" x="91" y="244" text-anchor="middle">hands the change</text>
<text class="t-node" x="91" y="257" text-anchor="middle">to update(), waits</text>
<text class="t-bad" x="91" y="290" text-anchor="middle">waiting for update()</text>
<path class="ab" marker-end="url(#th-dl-ab)" d="M184,100 L148,206"/>
<rect class="stuck" x="28" y="306" width="126" height="30" rx="4"/>
<text class="t-mono-bad" x="91" y="319" text-anchor="middle">update()</text>
<text class="t-sub" x="91" y="332" text-anchor="middle">can't run: thread busy</text>
<text class="t-bad-b" x="91" y="356" text-anchor="middle">deadlock: the clock stops</text>
<text class="t-sub" x="91" y="369" text-anchor="middle">and the spawner gets no answer</text>
<rect class="idle" x="182" y="136" width="148" height="30" rx="4"/>
<text class="t-node" x="256" y="149" text-anchor="middle">waits for work</text>
<text class="t-sub" x="256" y="162" text-anchor="middle">finds the queue empty</text>
<text class="t-sub" x="256" y="186" text-anchor="middle">the physics thread</text>
<text class="t-sub" x="256" y="199" text-anchor="middle">took the request</text>
</svg>
</figure>
<figcaption>Time runs downward. Blue: the controller manager's <code>switch_controller</code> callback, and where its request goes. In case 1, a ROS spinner thread runs the callback, and the physics thread keeps stepping. In case 2, <code>ros::spinOnce()</code> runs the callback in the physics thread, which then waits for an <code>update()</code> that only it can run.</figcaption>

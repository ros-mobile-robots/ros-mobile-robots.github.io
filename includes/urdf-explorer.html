<div class="ix-step-texts"><p data-step-text="visual">The <b>visual</b> shapes are what RViz and Gazebo draw. The physics engine never looks at them. Parts with a model in <code>robot_component_models</code> show that model. The other parts are drawn as simple shapes.</p><p data-step-text="collision" hidden>The <b>collision</b> shapes are what the physics engine checks for contact. They are simple on purpose: boxes, cylinders and, for the drive wheels, spheres. A sphere touches flat ground at one point, in the middle of the wheel.</p><p data-step-text="inertia" hidden>Each link has a mass, a center of mass and an inertia. The dot is the center of mass. The box is a uniform box with the same mass and the same inertia as the link, which is how Gazebo draws inertia. It isn't the part's outline.</p><p data-step-text="frames" hidden>Every link has a frame of its own: red x, green y, blue z. <code>base_footprint</code> lies on the ground under the midpoint of the drive wheels' axle, and <code>base_link</code> straight above it. For both, x points forward, y to the left and z up. Turn the wheels: a wheel's frame turns with its wheel.</p></div>

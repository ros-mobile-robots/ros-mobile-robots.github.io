site_name: DiffBot Differential Drive Mobile Robot
theme:
  name: material
  highlightjs: true
  custom_dir: docs/custom_theme
  features:
    - content.tabs.link
    - navigation.tabs
    - navigation.top
    - navigation.indexes
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

#extra_javascript:
#  - https://unpkg.com/mermaid@8.8.0/dist/mermaid.min.js
#  - custom_theme/js/config.js

# PR previews (preview.yml) build with SITE_URL=https://ros-mobile-robots.com/pr-preview/pr-<number>/
site_url: !ENV [SITE_URL, "https://ros-mobile-robots.com/"]
  
repo_url: https://github.com/ros-mobile-robots/diffbot

edit_uri: https://github.com/ros-mobile-robots/ros-mobile-robots.github.io/tree/main/docs

# Extra parameters
extra:
  asset_dir: /resources # /assets
  diffbot_repo_url: https://github.com/ros-mobile-robots/diffbot/blob/noetic-devel
  remo_repo_url: https://github.com/ros-mobile-robots/remo_description/blob/main
  docs_repo_url: https://github.com/ros-mobile-robots/ros-mobile-robots.github.io/blob/main
  disqus: ros-mobile-robots
  analytics:
    provider: google
    property: G-5Z9V7GPRX3

copyright: Copyright &copy; 2021 - 2026 Franz Pucher | As an Amazon Associate I earn from qualifying purchases. | <a href="https://www.ros-mobile-robots.com/privacy-policy/">Privacy Policy</a> | <a href="https://www.ros-mobile-robots.com/legal-notice/">Legal Notice</a> | <a href="#cookie-settings">Cookie settings</a>

markdown_extensions:
  - abbr
  - admonition
  - extra
  - footnotes
  - meta
  - pymdownx.details
  # includes/links.md holds the shared (affiliate) links as reference definitions
  # and is appended to every page, so pages can write [Amazon.de][amazon_rpi_4_ger]
  - pymdownx.snippets:
      auto_append:
        - includes/links.md
  - pymdownx.keys
  - pymdownx.highlight:
      linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.magiclink

plugins:
  - search
  # Downloads Google Fonts and external images at build time
  # and serves them from this site, so visitors don't contact those hosts. Google's ad, consent and
  # Analytics scripts and the Gumroad overlay must keep loading from their own hosts.
  - privacy:
      assets_exclude:
        - pagead2.googlesyndication.com/*
        - fundingchoicesmessages.google.com/*
        - www.googletagmanager.com/*
        - gumroad.com/*
  - glightbox
  - macros
  - mkdocs-jupyter:
      execute: False
      include_source: True
  # Old URLs that still get visits keep working: each one gets an HTML page that
  # redirects to the current page (source paths relative to docs/)
  - redirects:
      redirect_maps:
        projects/diffbot/URDF.md: robot-description.md
        projects/diffbot/components.md: components.md
        diffbot_base.md: packages/diffbot_base/index.md
        ros-network-setup.md: processing_units/ros-network-setup.md
        processing_units/git-setup.md: getting-started/git-and-github.md

nav:
  # Seven tabs, see the docs structure review. Only the menu changed: every page keeps its file
  # and its URL. Pages that aren't listed (the nearly empty theory pages) are still built.
  - Home: index.md
  - Getting Started:
    - Overview: technical_requirements.md
    - Set Up Your PC: getting-started/set-up-your-pc.md
    - Git and GitHub: getting-started/git-and-github.md
    - Development Environment:
      - Use the Dev Container: development/dev-container.md
      - How the Dev Container Works: development/dev-container-internals.md
      - Docker Basics: theory/architecture/docker.md
  - Hardware:
    - hardware_setup/overview.md
    - Components (BOM): components.md
    - Build Remo:
      - 3D Printing: hardware_setup/3D_print.md
      - Electronics: hardware_setup/electronics.md
      - Assembly: hardware_setup/assembly.md
      - Install: hardware_setup/install.md
    - Processing Units:
      - processing_units/index.md
      - Raspberry Pi Setup: processing_units/rpi-setup.md
      - Jetson Nano Setup: processing_units/jetson-nano-setup.md
      - ROS Setup: processing_units/ros-setup.md
      - ROS Network Setup: processing_units/ros-network-setup.md
      - Microcontroller: processing_units/teensy-mcu.md
      - Hardware Interfaces: processing_units/hardware-interfaces.md
    - Actuators:
      - Motor and Encoder: DG01D-E-motor-with-encoder.md
      - Motor Driver (Grove I2C): grove_motor_driver.md
      - Actuator Notes (draft): theory/actuation.md
    - Sensors:
      - LiDAR: laser-range-scanner.md
      - IMU (BNO055): packages/imu/driver-bno055.md
      - Cameras:
        - Raspberry Pi Camera: packages/raspicam_node.md
        - OAK: oak.md
      - Ultrasonic Ranger: grove_ultrasonic_ranger.md
      - Wheel Encoders (LM393): lm393_speed_sensor.md
    - Power:
      - Power Supply: power-supply.md
  - ROS Packages:
    - packages/index.md
    - Packages Setup: packages/packages-setup.md
    - Robot Package: diffbot_robot.md
    - Robot Description:
      - Robot Description: robot-description.md
      - Remo Description: packages/remo_description.md
    - Simulation: diffbot_gazebo.md
    - Control: diffbot_control.md
    - Base Hardware Interface:
      - packages/diffbot_base/index.md
      - PID Controllers: packages/diffbot_base/pid.md
      - Low-Level PID Approach: packages/diffbot_base/low-level.md
      - High-Level PID Approach: packages/diffbot_base/high-level.md
    - Messages: diffbot_msgs.md
    - Hardware Bringup: diffbot_bringup.md
    - Navigation: diffbot_navigation.md
    - SLAM: diffbot_slam.md
    - Move Base Flex: diffbot_mbf.md
    - Perception: diffbot_perception.md
    - Localization (robot_localization): packages/imu/robot_localization.md
  - Robotics Theory:
    - theory/index.md
    # Hidden until written: Linear Algebra, Programming, Pinhole Camera Model, Recursive State Estimation
    - Preliminaries:
      - Probability: theory/preliminaries/probability.md
    - Modeling and Control:
      - Introduction to Control Systems: theory/modeling-control/control-systems-introduction.md
      - Representations and models: theory/modeling-control/robot-representations.md
      - Modeling a Differential Drive Robot: theory/modeling-control/modeling-differential-drive-robot.md
      - Odometry: theory/modeling-control/odometry.md
      - Motion and Odometry: theory/motion-and-odometry.md
    - Robot Vision:
      - Camera Calibration: theory/robot-vision/camera-calibration.md
      - Image Processing: theory/robot-vision/image-processing.md
      - Features and Segmentation: theory/robot-vision/features-and-segmentation.md
      - Tracking Image Features: theory/robot-vision/tracking-image-features.md
      - Combining Camera and Lidar: theory/robot-vision/combining-camera-and-lidar.md
      - Introduction to Neural Networks: theory/object-detection/introduction-to-neural-networks.md
    # - Object Detection: theory/object-detection/overview.md  # planned, not written yet
    - State Estimation:
      # - Gaussian Filters (Kalman Filter): theory/state-estimation/gaussian-filters.md  # planned, not written yet
      - Nonparametric Filters (Particle Filter): theory/state-estimation/nonparametric-filters.md
    - Localization:
      - Markov and Gaussian Localization: theory/localization/markov-and-gaussian-localization.md
      # - Grid and Monte Carlo Localization: theory/localization/grid-and-monte-carlo-localization.md  # planned, not written yet
    # - Mapping:  # planned, not written yet
      # - Occupancy Grid Mapping: theory/mapping/occupancy-grid-mapping.md
    - Simultaneous Localization and Mapping (SLAM):
      - SLAM Overview: theory/slam/slam-overview.md
      - Robot Moving and Sensing Notebook: theory/slam/1. Robot Moving and Sensing.ipynb
      - Omega and Xi Constraints Notebook: theory/slam/2. Omega and Xi, Constraints.ipynb
      - Landmark Detection and Tracking: theory/slam/3. Landmark Detection and Tracking.ipynb
      # - EKF SLAM: theory/slam/ekf-slam.md  # planned, not written yet
      # - GraphSLAM: theory/slam/graphslam.md  # planned, not written yet
      # - FastSLAM: theory/slam/fastslam.md  # planned, not written yet
      # - GMapping: theory/slam/gmapping.md  # planned, not written yet
    # - Planning I: theory/planning1/overview.md  # planned, not written yet
    # - Planning II: theory/planning2/overview.md  # planned, not written yet
    # - Learning by Reinforcement: theory/reinforcement-learning/overview.md  # planned, not written yet
    # - Learning by Imitation: theory/imitation-learning/overview.md  # planned, not written yet
  - Contributing:
    - development/index.md
    - Testing and CI: development/ci.md
  - Insiders: insiders/index.md

# Fail the strict build on links that MkDocs can check: missing pages, missing #anchors,
# and absolute links (/path) that don't exist in docs/.
validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
